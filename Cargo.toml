[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/client"]

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/getflyhigh/FlyHigh-SlipStream"
publish = false

[workspace.dependencies]
slipstream-core = { path = "crates/core" }
flyhigh-engine = { git = "https://github.com/getflyhigh/flyhigh-engine", tag = "v0.3.1" }
wgpu = "30"
pollster = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2"
bytemuck = "1"
tungstenite = "0.28"
zstd = "0.13"
openh264 = "0.9.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 3
